<body>

  <main id="room">

    <h1 id="headline">don't.</h1>

    <button id="button">press me</button>

    <p id="answer">you were told not to.</p>

  </main>

  <footer>
    <span id="tries">0</span>&nbsp;<span id="word">clicks</span>
  </footer>


<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;

  background:#e9e6df;
  color:#171717;

  font-family:Arial,Helvetica,sans-serif;
  text-align:center;

  transition:background .6s,color .6s;
}

#room{
  width:min(88%,620px);
  transition:transform .18s;
}

h1{
  margin:0 0 38px;

  font-size:clamp(64px,15vw,120px);
  line-height:.8;
  letter-spacing:-8px;
}

button{
  padding:15px 28px;

  border:1px solid currentColor;
  background:none;
  color:inherit;

  font:14px monospace;
  cursor:pointer;

  transition:.2s;
}

button:hover{
  background:#171717;
  color:#e9e6df;
}

button:active{
  transform:scale(.94);
}

#answer{
  margin:28px 0 0;
  min-height:20px;
  opacity:.55;
}

footer{
  position:fixed;
  bottom:18px;
  left:0;
  right:0;

  font:11px monospace;
  opacity:.3;
}

.shake{
  animation:shake .1s 3;
}

@keyframes shake{
  25%{transform:translateX(5px)}
  75%{transform:translateX(-5px)}
}
</style>


<script>
let count = 0;

const lines = [
  ["I SAID DON'T.","that was the first warning."],
  ["really?","you pressed it again."],
  ["why.","there are other buttons on the internet."],
  ["fine.","apparently this is happening now."],
  ["oh.","you've made it worse."],
  ["STOP.","I'm not asking anymore."]
];

button.onclick = () => {

  if(count === 10){

    count = 0;

    tries.textContent = 0;
    word.textContent = "clicks";

    document.body.style.background = "#e9e6df";
    document.body.style.color = "#171717";

    headline.textContent = "don't.";
    answer.textContent = "you were told not to.";

    button.textContent = "press me";
    button.style.position = "static";

    return;
  }

  count++;

  tries.textContent = count;
  word.textContent = count === 1 ? "click" : "clicks";

  room.classList.remove("shake");
  void room.offsetWidth;
  room.classList.add("shake");

  if(count <= lines.length){
    headline.textContent = lines[count-1][0];
    answer.textContent = lines[count-1][1];
  }

  if(count === 4){
    document.body.style.background = "#171717";
    document.body.style.color = "#e9e6df";

    button.textContent = "you know what you're doing";
  }

  if(count > 4 && count < 9){
    button.style.position = "relative";
    button.style.left = Math.random()*160-80 + "px";
    button.style.top = Math.random()*70-35 + "px";
  }

  if(count === 7){
    answer.textContent = "seriously, stop clicking it.";
  }

  if(count === 8){
    headline.textContent = "okay, enough.";
    answer.textContent = "this is getting embarrassing.";
  }

  if(count === 9){
    button.style.left = "0";
    button.style.top = "0";

    headline.textContent = "okay.";
    answer.textContent = "you win.";

    button.textContent = "leave it alone";
  }

  if(count === 10){
  headline.textContent = "good.";
  answer.textContent = "finally.";

  button.style.position = "static";
  button.style.visibility = "hidden";

  setTimeout(() => {
    button.textContent = "again";
    button.style.visibility = "visible";
  },1400);
}
};
</script>

</body>
